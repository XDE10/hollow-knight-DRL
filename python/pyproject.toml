[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hkrl"
version = "1.0.0"
description = "Hollow Knight Sisters of Battle Deep RL environment, native mod bridge, and training suite"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hk-rl" }]

dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "flatbuffers>=24.3.25",
    "psutil>=5.9",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hkrl*"]

# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python"]
exclude = ["hkrl/schema/HKRL"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B027", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "hkrl/schema/HKRL/"

# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live Hollow Knight + HKRLEnvMod connection",
    "slow: long-running training / rollout tests",
]
