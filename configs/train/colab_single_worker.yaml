# One Windows game worker; batch learner runs on the Colab GPU.
# Network tunnel and actual game sampling still require live acceptance.
defaults:
  - ./remote_learner.yaml

rollout_steps: 512
minibatch_size: 128
epochs: 2
learner:
  device: cuda
  batches_per_update: 1
  compile_mode: "off"
  max_staleness: 1
coordinator:
  num_workers: 1
security:
  bind_scope: localhost
  require_token: true
