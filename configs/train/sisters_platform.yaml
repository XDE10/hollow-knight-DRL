# Sisters of Battle recurrent policy training config.
defaults:
  - ./ppo_attention_gru.yaml

learning_rate: 0.000035
rollout_steps: 510
minibatch_size: 128
epochs: 2
sequence_length: 32
burn_in: 8
entropy_coef: 0.001

model:
  name: sisters_platform_gru
  entity_hidden: 64
  attention_layers: 1
  attention_heads: 4
  rnn_hidden: 128

learner:
  device: cpu
  compile_mode: "off"
