# Self-contained Sisters of Battle (Godhome) task & arena configuration.
# Zero external defaults inheritance so this file works standalone anywhere.
task_id: sisters_of_battle
wire_id: 2010
scene: GG_Mantis_Lords_V
difficulty: attuned
time_limit_seconds: 180

player:
  hp: max
  soul: 0
  charms: default

reward:
  boss_damage: 0.3
  player_damage: -12.0
  soul_gained: 0.0
  heal_amount: 1.0
  boss_kill: 100.0
  player_death: -100.0
  time_penalty: 0.0
  invalid_action: -0.01

observation:
  max_entities: 64
  include_fsm_state: true
  include_hitbox: true
  tier: privileged

action:
  action_repeat: 2
  enable_macro_actions: true
  n_macro_actions: 11
  expose_action_combinations: true

arena:
  auto_reset_on_terminal: true
  objective: win
